services:
  - type: web
    name: botpilot-panel
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: botpilot-data
      mountPath: /var/data
      sizeGB: 1
